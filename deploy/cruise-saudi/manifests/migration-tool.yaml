# Migration tool control plane (Python stdlib). Drives the code generator and the build toolchain
# (bal, docker, kubectl, helm) on this host over SSH with a dedicated key (Secret mt-ssh).
# Data: @@DATA@@/migration-tool on the host. Code generator workspace: @@PLATFORM_DIR@@.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-tool
  namespace: @@NS_WEAVE@@
  labels: { app.kubernetes.io/name: migration-tool, app.kubernetes.io/part-of: cruise-saudi-weave }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: migration-tool } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: migration-tool }
      annotations:
        weave/image: "@@IMG_MT@@"
    spec:
      enableServiceLinks: false
      # root inside the pod so it can read the root-owned 0400 key and write the hostPath data dir;
      # the pod already holds host SSH access, so the trust boundary is the admin token.
      securityContext: { runAsUser: 0 }
      hostAliases:
        - { ip: "@@APIM_CLUSTER_IP@@", hostnames: ["@@APIM_DOMAIN@@"] }
      containers:
        - name: app
          image: @@IMG_MT@@
          imagePullPolicy: IfNotPresent
          # 127.0.0.1:@@MT_NODEPORT@@ on the host only (the Factory and the installer); Service is ClusterIP
          ports: [ { name: http, containerPort: 8080, hostPort: @@MT_NODEPORT@@, hostIP: 127.0.0.1 } ]
          env:
            - { name: MT_RUNNER, value: "ssh" }
            - { name: MT_SSH_TARGET, value: "@@MT_SSH_TARGET@@" }
            - { name: MT_SSH_KEY, value: "/secrets/id_ed25519" }
            - { name: MT_PLATFORM_DIR, value: "@@PLATFORM_DIR@@" }
            - { name: MT_DATA_DIR, value: "/data" }
            - { name: MT_VERSIONS_HOME, value: "@@DATA@@/versions" }        # also pinned on the host by the SSH forced command
            - { name: SSL_CERT_FILE, value: "/etc/weave/ca/ca-bundle.pem" }   # OS bundle + internal CA + API Manager
            # publish each deployed API on API Manager, secured (Mule 4 -> WSO2 edition)
            - { name: MT_EDITION, value: "cruise-saudi" }
            - { name: MT_PUBLISH_ON_DEPLOY, value: "1" }
            - { name: APIM_BASE_URL, value: "https://@@APIM_DOMAIN@@:9443" }        # = wso2am ClusterIP (hostAliases below)
            - { name: APIM_CA_CERT_PATH, value: "/etc/weave/ca/ca-bundle.pem" }    # holds API Manager's own certificate
            - { name: APIM_GATEWAY_URL, value: "@@GATEWAY_PUBLIC_URL@@" }
            - name: APIM_DCR_USERNAME
              valueFrom: { secretKeyRef: { name: mt-apim, key: username } }
            - { name: APIM_DCR_PASSWORD_FILE, value: "/secrets-apim/password" }
            - name: MT_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: mt-admin, key: token } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: ssh, mountPath: /secrets, readOnly: true }
            - { name: ca, mountPath: /etc/weave/ca, readOnly: true }
            - { name: apim, mountPath: /secrets-apim, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          hostPath: { path: @@DATA@@/migration-tool, type: DirectoryOrCreate }
        - name: ssh
          secret: { secretName: mt-ssh, defaultMode: 0400 }
        - name: ca
          configMap: { name: weave-ca-trust }
        - name: apim
          secret: { secretName: mt-apim, defaultMode: 0400, items: [ { key: password, path: password } ] }
---
apiVersion: v1
kind: Service
metadata:
  name: migration-tool
  namespace: @@NS_WEAVE@@
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: migration-tool }
  ports:
    - { name: http, port: 80, targetPort: http }
