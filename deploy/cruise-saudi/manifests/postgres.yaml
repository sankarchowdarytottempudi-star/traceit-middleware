# PostgreSQL 16 for WSO2 API Manager (databases apim_db + shared_db, owner apimadmin).
# Data: @@DATA@@/postgres on the host (static PersistentVolume, reclaim policy Retain).
# Credentials come from Secret apim-db (created by install.sh from secrets.env).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: @@PREFIX@@apim-postgres
  labels: { app.kubernetes.io/part-of: cruise-saudi-weave }
spec:
  capacity: { storage: @@PG_DATA_SIZE@@ }
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { namespace: @@NS_APIM@@, name: apim-postgres-data }
  hostPath: { path: @@DATA@@/postgres, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apim-postgres-data
  namespace: @@NS_APIM@@
  labels: { app.kubernetes.io/part-of: cruise-saudi-weave }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: @@PREFIX@@apim-postgres
  resources: { requests: { storage: @@PG_DATA_SIZE@@ } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apim-postgres-init
  namespace: @@NS_APIM@@
data:
  10-apim.sh: |
    #!/bin/sh
    # runs once, on an empty data directory
    set -e
    psql -v ON_ERROR_STOP=1 --username postgres <<SQL
    CREATE USER apimadmin WITH PASSWORD '${APIM_DB_PASSWORD}';
    CREATE DATABASE apim_db OWNER apimadmin;
    CREATE DATABASE shared_db OWNER apimadmin;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apim-postgres
  namespace: @@NS_APIM@@
  labels: { app: apim-postgres, app.kubernetes.io/part-of: cruise-saudi-weave }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: apim-postgres } }
  template:
    metadata:
      labels: { app: apim-postgres }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: @@PG_IMAGE@@
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=300", "-c", "shared_buffers=256MB"]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: apim-db, key: superuser-password } }
            - name: APIM_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: apim-db, key: apim-password } }
          ports: [ { containerPort: 5432, name: pg } ]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "@@PG_CPU_LIMIT@@", memory: @@PG_MEMORY_LIMIT@@ }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: apim-postgres-data }
        - name: init
          configMap: { name: apim-postgres-init, defaultMode: 0755 }
---
apiVersion: v1
kind: Service
metadata:
  name: apim-postgres
  namespace: @@NS_APIM@@
spec:
  selector: { app: apim-postgres }
  ports: [ { name: pg, port: 5432, targetPort: pg } ]
