apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: weave-gateway }
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: weave-gateway }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
